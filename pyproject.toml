[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oinyx"
version = "0.1.0"
description = "Provider-agnostic client library for chat-completion AI models, with a plugin registry and no built-in providers."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "oinyx contributors" }]
keywords = ["ai", "llm", "chat", "provider", "plugin"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Framework :: AsyncIO",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Only needed by future provider plugins that talk HTTP; the core never imports it.
http = ["httpx>=0.27"]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5",
  "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/BoreServices/oinyx"
Issues = "https://github.com/BoreServices/oinyx/issues"

[tool.hatch.build.targets.wheel]
packages = ["oinyx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
markers = [
  "live: hits the real upstream APIs; opt in with -m live",
]
addopts = "-q --cov=oinyx --cov=providers --cov-report=term-missing -m 'not live'"

[tool.coverage.run]
branch = true
source = ["oinyx", "providers"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_unreachable = true
files = ["oinyx", "providers"]
